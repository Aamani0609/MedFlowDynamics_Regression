# Sections follow the Medflow Dynamics menu order, like the numbered test files

# Environment
baseUrl=https://dev.medflowdynamics.com
loginPath=/login?returnUrl=%2Fdashboard
# Browser tab title every page should have (02-PageTitle)
appTitle=Medflow Dynamics
# Name shown as "Created by" on the test report
reportAuthor=Aamani Pylla

# Credentials (01-Login): username and password are in config.local.properties (not in Git).
# Copy config.local.example.properties to config.local.properties to set them up.

# Governance > Audits (04-Audits)
