auditTemplate=Prescribing Safety Audit
auditLead=Mitra R
auditActionOwner=Mitra R
# The audit creator can't approve their own audit; it is sent to this approver
auditApprover=Mitra R
# Approver login (approverUsername / approverPassword) is in config.local.properties

